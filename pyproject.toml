[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "india-crop-risk"
version = "0.2.0"
description = "Data-backed historical district crop-production and yield-risk monitoring"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Crop Risk Project Contributors" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "statsmodels>=0.14,<1",
  "PyYAML>=6.0,<7",
  "streamlit>=1.40,<2",
  "plotly>=5.24,<7",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]
vision = [
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
  "Pillow>=10.4,<13",
]
nlp = [
  "transformers>=4.46,<6",
  "sentencepiece>=0.2,<1",
]

[project.scripts]
crop-risk = "crop_risk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/crop_risk"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
